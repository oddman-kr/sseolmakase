<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>검수 · 썰마카세</title>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#151312;color:#F3EADB;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 32px}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.toc-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;border:1px solid #4A413A;background:#221E1B;color:#F3EADB;border-radius:12px;padding:10px 14px;min-height:48px}
.toc-btn .ep{font-weight:800;color:#FFB4A8;flex:0 0 auto}
.toc-btn .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.toc-btn .ar{flex:0 0 auto;opacity:.7}
.epnav{width:48px;height:48px;border-radius:12px;border:0;background:#2A2522;color:#F3EADB;font-size:20px;font-weight:700}
.epnav:disabled{opacity:.3}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;background:#3A332E;color:#F3EADB;white-space:nowrap}
.badge.approved{background:#2E5E3A}.badge.published{background:#1F3A5F}.badge.failed{background:#7A1A14}.badge.publishing{background:#6B4A2E}.badge.deleted{background:#555;color:#ccc}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/5;touch-action:pan-y}
.stage img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.tap{position:absolute;top:0;bottom:0;width:35%;background:transparent;border:0}
.tap.l{left:0}.tap.r{right:0}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.nav button{font-size:22px;font-weight:700;width:64px;height:48px;border-radius:12px;border:0;background:#2A2522;color:#F3EADB}
.nav button:disabled{opacity:.3}
.nav span{font-size:16px;font-weight:700}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:#4A413A}
.dots i.on{background:#F3EADB}
.panel{margin-top:14px;background:#221E1B;border:1px solid #3A332E;border-radius:12px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel .btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.panel .btns button{border:0;border-radius:10px;padding:11px 6px;min-height:46px;font-size:14.5px;font-weight:700}
.ok{background:#A8231C;color:#fff}.no{background:#3A332E;color:#F3EADB}.del{background:#4A1512;color:#FFB4A8}
.panel input{font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid #5A4F45;background:#151312;color:#F3EADB;width:100%}
.panel label{font-size:13px;color:#BDB1A0;display:block;margin:12px 0 6px}
.msg{font-size:13.5px;color:#CFC3B2;margin-top:10px;white-space:pre-line}
.confirm{display:none;margin-top:10px;padding:12px;border-radius:10px;background:#3A1A17;border:1px solid #7A1A14;font-size:14px}
.confirm.on{display:block}
.confirm .row{margin-top:8px}
.confirm button{border:0;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700}
.desc{margin-top:14px;font-size:14px;line-height:1.6;color:#BDB1A0;white-space:pre-line}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.dim.on{display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:#1E1A17;border-radius:18px 18px 0 0;z-index:11;transform:translateY(100%);transition:transform .2s ease;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.drawer.on{transform:translateY(0)}
.drawer .hd{padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
.drawer .hd strong{flex:1;font-size:17px}
.drawer .hd button{border:0;background:#2A2522;color:#F3EADB;border-radius:10px;width:44px;height:44px;font-size:18px}
.drawer .tools{padding:0 16px 10px;display:flex;gap:8px;align-items:center}
.drawer .tools input[type=search]{flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid #4A413A;background:#151312;color:#F3EADB;min-width:0}
.drawer .tools label{font-size:13px;color:#BDB1A0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.drawer .tools input[type=checkbox]{width:18px;height:18px;flex:0 0 auto}
.list{overflow-y:auto;padding:0 8px 16px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:#F3EADB;padding:12px 10px;border-radius:10px;min-height:52px}
.item:hover,.item.cur{background:#2A2522}
.item .n{font-weight:800;color:#FFB4A8;width:46px;flex:0 0 auto}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.empty{padding:20px;text-align:center;color:#8A7F72;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<button class="epnav" id="prevEp" type="button" aria-label="이전 화">‹</button>
<button class="toc-btn" id="openToc" type="button" aria-haspopup="dialog" aria-label="목차 열기"><span class="ep" id="curEp">#—</span><span class="ti" id="curTitle">불러오는 중</span><span class="badge" id="curBadge"></span><span class="ar">▾</span></button>
<button class="epnav" id="nextEp" type="button" aria-label="다음 화">›</button>
</div>

<div class="stage" id="stage">
<img id="img" alt="">
<button class="tap l" id="tapL" type="button" aria-label="이전 장"></button>
<button class="tap r" id="tapR" type="button" aria-label="다음 장"></button>
</div>
<div class="nav">
<button id="prev" type="button" aria-label="이전 장">←</button>
<span id="num">1 / 1</span>
<button id="next" type="button" aria-label="다음 장">→</button>
</div>
<div class="dots" id="dots"></div>

<div class="panel">
<div class="row"><span>인스타 상태</span><span class="badge" id="igSt">확인 중</span></div>
<div class="btns">
<button class="ok" id="approve" type="button">승인</button>
<button class="no" id="unapprove" type="button">승인 취소</button>
<button class="del" id="delete" type="button">삭제</button>
</div>
<div class="confirm" id="confirm" role="alertdialog" aria-live="assertive">
<div>이 썰을 삭제할까요? 목차에서 숨겨지고 인스타에 올라가지 않습니다. (나중에 복구 가능)</div>
<div class="row"><button class="del" id="confirmYes" type="button">삭제하기</button><button class="no" id="confirmNo" type="button">취소</button></div>
</div>
<label for="pw">관리자 비밀번호 (Supabase의 ADMIN_PASSCODE, 이 기기에 저장)</label>
<input id="pw" type="password" autocomplete="current-password">
<div class="msg" id="igMsg">승인한 썰은 매일 12:00, 16:00에 승인한 순서대로 한 편씩 인스타에 올라갑니다.</div>
</div>
<div class="desc" id="desc"></div>
</div>

<div class="dim" id="dim"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="목차">
<div class="hd"><strong>목차 <span id="cnt" style="font-weight:500;color:#BDB1A0;font-size:14px"></span></strong><button id="closeToc" type="button" aria-label="목차 닫기">✕</button></div>
<div class="tools">
<input id="q" type="search" placeholder="번호나 제목으로 찾기 (예: 12, 축의금)" aria-label="목차 검색">
<label><input type="checkbox" id="showDel"> 삭제된 것</label>
</div>
<div class="list" id="list"></div>
</div>

<script>
(function(){
  var FN="https://rkcgqhmnhiwgfzglkvto.supabase.co/functions/v1/ig";
  var LABEL={draft:"미승인",approved:"게시 대기",publishing:"게시 중",published:"게시 완료",failed:"게시 실패",deleted:"삭제됨"};
  var posts=[], status={}, cur=-1, page=0;
  function $(id){return document.getElementById(id);}
  function st(p){return (status[p.id]||{}).status||"draft";}
  function visible(){var showDel=$("showDel").checked; return posts.filter(function(p){return showDel||st(p)!=="deleted";});}
  function src(k){var p=posts[cur]; return "posts/"+p.id+"/"+p.images[k]+(p.v?"?v="+p.v:"");}
  function showPage(){
    var p=posts[cur]; if(!p)return;
    $("img").src=src(page); $("img").alt=p.title+" "+(page+1)+"장";
    $("num").textContent=(page+1)+" / "+p.images.length;
    $("prev").disabled=page===0; $("next").disabled=page===p.images.length-1;
    $("dots").innerHTML=p.images.map(function(_,k){return "<i class='"+(k===page?"on":"")+"'></i>";}).join("");
    if(page+1<p.images.length){var pre=new Image(); pre.src=src(page+1);}
  }
  function renderHeader(){
    var p=posts[cur]; if(!p)return;
    var s=st(p);
    $("curEp").textContent="#"+p.id; $("curTitle").textContent=p.title;
    $("curBadge").textContent=LABEL[s]||s; $("curBadge").className="badge "+s;
    $("igSt").textContent=LABEL[s]||s; $("igSt").className="badge "+s;
    $("delete").textContent = s==="deleted" ? "복구" : "삭제";
    var vis=visible(), i=vis.indexOf(p);
    $("prevEp").disabled = i<=0; $("nextEp").disabled = i<0 || i>=vis.length-1;
    var e=(status[p.id]||{}).error; if(s==="failed"&&e)$("igMsg").textContent="실패 이유: "+e;
  }
  function select(i){
    if(i<0||i>=posts.length)return;
    cur=i; page=0; $("confirm").classList.remove("on");
    $("desc").textContent=posts[cur].description||"";
    try{history.replaceState(null,"","#"+posts[cur].id);}catch(e){}
    renderHeader(); showPage();
  }
  function stepEp(d){var vis=visible(), i=vis.indexOf(posts[cur]); var n=vis[i+d]; if(n)select(posts.indexOf(n));}
  function go(d){var p=posts[cur]; var n=page+d; if(p&&n>=0&&n<p.images.length){page=n; showPage();}}
  function renderList(){
    var q=$("q").value.trim().toLowerCase(), vis=visible();
    var rows=vis.filter(function(p){return !q || p.id.indexOf(q)>=0 || String(parseInt(p.id,10))===q || (p.title||"").toLowerCase().indexOf(q)>=0;});
    $("cnt").textContent="("+vis.length+"편)";
    if(!rows.length){$("list").innerHTML="<div class='empty'>찾는 썰이 없어요</div>";return;}
    $("list").innerHTML="";
    rows.slice().reverse().forEach(function(p){
      var s=st(p), b=document.createElement("button");
      b.type="button"; b.className="item"+(posts[cur]===p?" cur":"");
      b.innerHTML="<span class='n'>#"+p.id+"</span><span class='t'></span><span class='badge "+s+"'>"+(LABEL[s]||s)+"</span>";
      b.querySelector(".t").textContent=p.title;
      b.onclick=function(){select(posts.indexOf(p)); closeToc();};
      $("list").appendChild(b);
    });
  }
  function openToc(){renderList(); $("dim").classList.add("on"); $("drawer").classList.add("on"); setTimeout(function(){var c=$("list").querySelector(".cur"); if(c)c.scrollIntoView({block:"center"});},50);}
  function closeToc(){$("dim").classList.remove("on"); $("drawer").classList.remove("on"); $("openToc").focus();}
  $("openToc").onclick=openToc; $("closeToc").onclick=closeToc; $("dim").onclick=closeToc;
  $("q").oninput=renderList; $("showDel").onchange=function(){renderList(); renderHeader();};
  function call(body){return fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();});}
  function pw(){var v=$("pw").value; try{if(v)localStorage.setItem("sseol_pw",v); else v=localStorage.getItem("sseol_pw")||"";}catch(e){} return v;}
  try{$("pw").value=localStorage.getItem("sseol_pw")||"";}catch(e){}
  function refresh(){return call({action:"list"}).then(function(d){status={};(d.posts||[]).forEach(function(x){status[x.id]=x;}); renderHeader();}).catch(function(){$("igSt").textContent="서버 연결 실패";});}
  var MSG={approve:"승인했어요. 다음 12:00 또는 16:00에 순서대로 올라갑니다.",unapprove:"승인을 취소했어요.",delete:"삭제했어요. 목차의 '삭제된 것'에서 복구할 수 있어요.",restore:"복구했어요."};
  function act(a){
    var w=pw(); if(!w){$("igMsg").textContent="관리자 비밀번호를 먼저 입력해 주세요.";$("pw").focus();return;}
    var p=posts[cur]; $("igMsg").textContent="처리 중…";
    call({action:a,id:p.id,passcode:w}).then(function(d){
      if(d.error==="wrong_passcode"){$("igMsg").textContent="비밀번호가 맞지 않습니다. Supabase의 ADMIN_PASSCODE 값과 같은지 확인해 주세요.";try{localStorage.removeItem("sseol_pw");}catch(e){}return;}
      if(d.error){$("igMsg").textContent="오류: "+d.error;return;}
      $("igMsg").textContent=MSG[a];
      refresh().then(function(){ if(a==="delete" && !$("showDel").checked){ var before=cur; stepEp(1); if(cur===before) stepEp(-1);} });
    }).catch(function(){$("igMsg").textContent="서버에 연결할 수 없습니다.";});
  }
  $("approve").onclick=function(){act("approve");};
  $("unapprove").onclick=function(){act("unapprove");};
  $("delete").onclick=function(){ if(st(posts[cur])==="deleted"){act("restore");return;} $("confirm").classList.add("on"); $("confirmYes").focus(); };
  $("confirmYes").onclick=function(){$("confirm").classList.remove("on"); act("delete");};
  $("confirmNo").onclick=function(){$("confirm").classList.remove("on");};
  $("prev").onclick=function(){go(-1);}; $("next").onclick=function(){go(1);};
  $("tapL").onclick=function(){go(-1);}; $("tapR").onclick=function(){go(1);};
  $("prevEp").onclick=function(){stepEp(-1);}; $("nextEp").onclick=function(){stepEp(1);};
  document.addEventListener("keydown",function(e){
    if($("drawer").classList.contains("on")){ if(e.key==="Escape")closeToc(); return; }
    if(e.target.tagName==="INPUT")return;
    if(e.key==="ArrowLeft")go(-1); if(e.key==="ArrowRight")go(1);
  });
  var x0=null;
  $("stage").addEventListener("touchstart",function(e){x0=e.touches[0].clientX;},{passive:true});
  $("stage").addEventListener("touchend",function(e){if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40)go(dx<0?1:-1); x0=null;});
  fetch("posts/posts.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(list){
    posts=list; return refresh();
  }).then(function(){
    var h=location.hash.slice(1), i=posts.findIndex(function(q){return q.id===h;});
    if(i<0){var vis=visible(); i=posts.indexOf(vis[vis.length-1]||posts[posts.length-1]);}
    select(i);
  });
})();
</script>
</body>
</html>
