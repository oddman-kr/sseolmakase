<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>업로더 · 썰마카세 업로더</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:980px}
.acct{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:20px}
.acct img{width:48px;height:48px;border-radius:50%;background:#eee}
.acct .who{flex:1}
.acct .who strong{display:block;font-size:16px}
.acct .who span{color:var(--muted);font-size:14px}
button,.btn{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 18px;cursor:pointer;min-height:44px}
button.primary,.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.panel h3{margin:0 0 12px;color:var(--ink)}
.posts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.posts button[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.viewer{position:relative;background:#111;border-radius:8px;overflow:hidden;aspect-ratio:4/5}
.viewer img{width:100%;height:100%;object-fit:contain;display:block}
.vnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.thumbs img{width:56px;height:70px;object-fit:cover;border-radius:4px;border:2px solid transparent;cursor:pointer}
.thumbs img.on{border-color:var(--red)}
label.f{display:block;font-weight:700;font-size:14.5px;margin:14px 0 6px}
input[type=text],textarea,select{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #CFC5B6;border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}
.count{font-size:12.5px;color:var(--muted);text-align:right}
.check{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}
.check input{width:20px;height:20px}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.sub{margin-left:30px;padding:10px 12px;background:#FBF8F3;border-radius:8px}
.notice{font-size:14px;background:#FFF6E5;border:1px solid #F0D9A8;border-radius:8px;padding:10px 12px;margin:12px 0}
.declare{font-size:14px;color:#333;margin:16px 0}
.status{margin-top:14px;font-size:14.5px;white-space:pre-line}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
<img src="logo.png" alt="썰마카세 로고">
<div>
<h1>썰마카세 업로더</h1>
<p>검수한 썰 카드를 TikTok에 게시합니다</p>
</div>
</header>
<nav class="legal" aria-label="약관 및 정책">
<a href="index.html">홈</a>
<a href="terms.html">이용약관 (Terms of Service)</a>
<a href="privacy.html">개인정보처리방침 (Privacy Policy)</a>
</nav>

<section id="connect" class="panel hidden">
<h3>TikTok 계정 연결</h3>
<p>게시할 TikTok 계정으로 로그인해 주세요. 연결은 TikTok 앱의 설정에서 언제든지 해제할 수 있습니다.</p>
<button class="primary" id="loginBtn" type="button">TikTok으로 계속하기</button>
</section>

<section id="app" class="hidden">
<div class="acct">
<img id="avatar" alt="">
<div class="who"><strong id="nick">-</strong><span>이 계정에 게시됩니다</span></div>
<button id="logoutBtn" type="button">연결 해제</button>
</div>

<div class="posts" id="postList" role="group" aria-label="게시할 썰 선택"></div>

<div class="grid">
<div class="panel">
<h3>미리보기</h3>
<div class="viewer"><img id="viewImg" alt="카드 미리보기"></div>
<div class="vnav">
<button id="prevBtn" type="button" aria-label="이전 카드">←</button>
<span id="pageNo">1 / 1</span>
<button id="nextBtn" type="button" aria-label="다음 카드">→</button>
</div>
<div class="thumbs" id="thumbs"></div>
</div>

<div class="panel">
<h3>게시 설정</h3>
<div id="cantPost" class="notice hidden"></div>

<label class="f" for="title">제목</label>
<input type="text" id="title" maxlength="90">
<div class="count"><span id="titleCount">0</span> / 90</div>

<label class="f" for="desc">설명</label>
<textarea id="desc" maxlength="4000"></textarea>
<div class="count"><span id="descCount">0</span> / 4000</div>

<label class="f" for="privacy">누가 볼 수 있나요?</label>
<select id="privacy" required>
<option value="" selected disabled>공개 범위를 선택하세요</option>
</select>
<p class="hint" id="privacyHint"></p>

<div class="f" style="font-weight:700;margin-top:16px">상호작용 허용</div>
<label class="check"><input type="checkbox" id="allowComment"> 댓글 허용</label>
<p class="hint" id="commentHint"></p>

<label class="check"><input type="checkbox" id="autoMusic"> TikTok 추천 음악 자동 추가</label>

<div class="f" style="font-weight:700;margin-top:16px">콘텐츠 공개</div>
<label class="check"><input type="checkbox" id="disclose"> 이 게시물은 상품·브랜드·서비스를 홍보합니다</label>
<div id="discloseBox" class="sub hidden">
<label class="check"><input type="checkbox" id="yourBrand"> 내 브랜드 (본인 또는 본인 사업 홍보)</label>
<label class="check"><input type="checkbox" id="branded"> 브랜디드 콘텐츠 (제3자 브랜드와의 유료 파트너십)</label>
<p class="hint" id="labelHint"></p>
</div>

<p class="declare" id="declare"></p>

<button class="primary" id="postBtn" type="button" disabled>TikTok에 게시</button>
<div class="status" id="status" role="status" aria-live="polite"></div>
</div>
</div>
</section>

<footer>© 2026 썰마카세 · <a href="terms.html">이용약관</a> · <a href="privacy.html">개인정보처리방침</a></footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
