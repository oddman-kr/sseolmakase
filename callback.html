<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok 연결 · 썰마카세 업로더</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header>
<img src="logo.png" alt="썰마카세 로고">
<div>
<h1>TikTok 계정 연결</h1>
<p>썰마카세 업로더</p>
</div>
</header>
<nav class="legal" aria-label="약관 및 정책">
<a href="terms.html">이용약관 (Terms of Service)</a>
<a href="privacy.html">개인정보처리방침 (Privacy Policy)</a>
</nav>
<div class="card" id="box">
<p id="msg">연결 정보를 확인하는 중입니다…</p>
</div>
<footer>© 2026 썰마카세 · <a href="index.html">홈</a></footer>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var msg = document.getElementById('msg');
  if (p.get('error')) {
    msg.textContent = '연결이 취소되었거나 실패했습니다: ' + (p.get('error_description') || p.get('error'));
    return;
  }
  var code = p.get('code');
  if (!code) { msg.textContent = '연결 정보가 없습니다. 업로더에서 다시 시도해 주세요.'; return; }
  msg.textContent = 'TikTok 계정 연결 승인이 완료되었습니다. 아래 코드를 업로더에 붙여넣어 주세요. 이 코드는 몇 분 안에 만료되며 한 번만 쓸 수 있습니다.';
  var pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;word-break:break-all;background:#F4EFE7;padding:12px;border-radius:8px;font-size:14px';
  pre.textContent = code;
  document.getElementById('box').appendChild(pre);
  history.replaceState(null, '', location.pathname);
})();
</script>
</body>
</html>
